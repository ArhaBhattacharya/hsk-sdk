name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pyproject.toml sets HSK_FETCH_EIGEN=OFF, so each cibuildwheel environment
      # must already have Eigen 3.4.0 on disk (Linux builds run inside manylinux).
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux_*"
          CIBW_ARCHS: auto
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BEFORE_ALL_LINUX: git clone --depth 1 --branch 3.4.0 https://gitlab.com/libeigen/eigen.git /tmp/eigen
          CIBW_ENVIRONMENT_LINUX: CMAKE_ARGS="-DHSK_EIGEN_INCLUDE_DIR=/tmp/eigen"
          CIBW_BEFORE_ALL_MACOS: git clone --depth 1 --branch 3.4.0 https://gitlab.com/libeigen/eigen.git /tmp/eigen
          CIBW_ENVIRONMENT_MACOS: CMAKE_ARGS="-DHSK_EIGEN_INCLUDE_DIR=/tmp/eigen"
          CIBW_BEFORE_ALL_WINDOWS: git clone --depth 1 --branch 3.4.0 https://gitlab.com/libeigen/eigen.git C:/eigen-src
          CIBW_ENVIRONMENT_WINDOWS: CMAKE_ARGS="-DHSK_EIGEN_INCLUDE_DIR=C:/eigen-src"
          CIBW_TEST_REQUIRES: "pytest>=7"
          CIBW_TEST_COMMAND: 'python -c "import hsk; assert hsk.BACKEND == ''native'', hsk.BACKEND" && pytest -v {project}/tests/test_core_priorities.py'

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  duckdb-extension:
    name: DuckDB extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: duckdb/duckdb
          ref: v1.1.2
          path: duckdb-src

      - name: Install Ubuntu build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ git

      - name: Print toolchain (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          cat /etc/os-release | head -3
          g++ --version | head -1
          g++ -dumpfullversion -dumpversion
          ldd --version | head -1

      - name: Configure (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHSK_DUCKDB_SOURCE_DIR="${{ github.workspace }}/duckdb-src"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DHSK_DUCKDB_SOURCE_DIR="${{ github.workspace }}/duckdb-src"

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v ninja >/dev/null || brew install ninja
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHSK_DUCKDB_SOURCE_DIR="${{ github.workspace }}/duckdb-src"

      # DuckDB v1.1.2's third_party/fsst/libfsst.hpp uses uint8_t..uint64_t without including
      # <cstdint>; newer libstdc++ no longer provides it transitively. Official Linux DuckDB v1.1.2
      # binaries also use _GLIBCXX_USE_CXX11_ABI=0 (linux_amd64_gcc4), whereas ubuntu-latest
      # defaults to ABI=1 (linux_amd64). The inner DuckDB configure seeds CMAKE_CXX_FLAGS from CXXFLAGS.
      - name: Build duckdb_hsk
        env:
          CXXFLAGS: ${{ runner.os == 'Linux' && '-include cstdint -D_GLIBCXX_USE_CXX11_ABI=0' || '' }}
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ runner.os == 'macOS' && '3' || '4' }}
        run: cmake --build build --config Release --target duckdb_hsk

      - name: Stage extension binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-ext
          found="$(find build -name 'hsk.duckdb_extension' | head -n 1)"
          if [ -z "${found}" ]; then
            echo "hsk.duckdb_extension not found under build/" >&2
            find build -type f | head -n 200
            exit 1
          fi
          cp "${found}" "dist-ext/hsk-${{ runner.os }}.duckdb_extension"
          ls -la dist-ext

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke-test extension
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --only-binary=duckdb "duckdb==1.1.2"
          python - <<'PY'
          import pathlib
          import shutil
          import tempfile
          import duckdb

          src = pathlib.Path("dist-ext/hsk-${{ runner.os }}.duckdb_extension")
          tmp = pathlib.Path(tempfile.mkdtemp())
          try:
              dst = tmp / "hsk.duckdb_extension"
              shutil.copy2(src, dst)
              con = duckdb.connect(config={"allow_unsigned_extensions": "true"})
              print("PRAGMA platform:", con.execute("PRAGMA platform").fetchall())
              con.execute(f"LOAD '{dst.as_posix()}'")
              con.execute("""
                  CREATE TABLE e AS
                  SELECT (i % 1000)::BIGINT r, ((i * 7) % 500)::BIGINT c, (i % 13)::DOUBLE v
                  FROM range(100000) t(i);
              """)
              ok = con.execute(
                  "SELECT hsk_sketch_agg(r, c, v, 1000, 500, 5, 42::UBIGINT) IS NOT NULL FROM e;"
              ).fetchone()
              assert ok == (True,), f"Unexpected agg result: {ok}"
              rows_5 = con.execute("""
                  WITH s AS (SELECT hsk_sketch_agg(r, c, v, 1000, 500, 5, 42::UBIGINT) sk FROM e)
                  SELECT t.component_idx, t.singular_value FROM s, LATERAL hsk_sketch_svd(s.sk, 5) t;
              """).fetchall()
              assert len(rows_5) == 5, f"Expected 5 rows for k=5, got {len(rows_5)}"
              rows_clamped = con.execute("""
                  WITH s AS (SELECT hsk_sketch_agg(r, c, v, 1000, 500, 5, 42::UBIGINT) sk FROM e)
                  SELECT t.component_idx, t.singular_value FROM s, LATERAL hsk_sketch_svd(s.sk, 999) t;
              """).fetchall()
              assert len(rows_clamped) == 5, f"Expected 5 rows for k=999 (clamped), got {len(rows_clamped)}"
              con.close()
              print("Smoke test passed:", len(rows_5), "rows (k=5),", len(rows_clamped), "rows (k=999 clamped)")
          finally:
              shutil.rmtree(tmp, ignore_errors=True)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: duckdb-extension-${{ runner.os }}
          path: dist-ext/*.duckdb_extension
          if-no-files-found: error
